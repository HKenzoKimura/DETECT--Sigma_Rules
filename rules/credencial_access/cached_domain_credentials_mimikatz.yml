title: Cached Domain Credentials Dump — Mimikatz lsadump::cache
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: test
description: |
  Detecta tentativa de dump das credenciais em cache (MSCache2/DCC2) via Mimikatz
  (lsadump::cache). O ataque lê hashes armazenados no registro para permitir login offline
  e pode ser usada para cracking offline ou pass-the-cache em ambientes sem DC acessível.
  A detecção cobre dois ângulos: criação do processo Mimikatz e acesso ao registro LSA.
references:
  - https://attack.mitre.org/techniques/T1003/005/
  - https://www.thehacker.recipes/ad/movement/credentials/dumping/cached-domain-credentials
author: HKK
date: 2025/07/01
modified: 2025/07/01
tags:
  - attack.credential_access
  - attack.t1003.005
logsource:
  product: windows
  service: security
detection:
  # Vetor 1: Acesso a arquivo/chave de registro LSA Secrets (requer Audit Object Access)
  selection_registry_access:
    EventID: 4663
    ObjectName|contains:
      - '\SECURITY\Cache'
      - '\SECURITY\Policy\Secrets'
    ProcessName|endswith:
      - '\mimikatz.exe'
      - '\mimilib.dll'
  # Vetor 2: Linha de comando com argumentos do Mimikatz
  selection_process_args:
    EventID: 4688
    NewProcessName|endswith:
      - '\mimikatz.exe'
      - '\mimilsa.exe'
    CommandLine|contains:
      - 'lsadump::cache'
      - 'lsadump::secrets'
  # Vetor 3: Processo genérico acessando chave de cache de domínio
  selection_lsa_cache_access:
    EventID: 4663
    ObjectName|contains: '\SECURITY\Cache'
  filter_system:
    SubjectUserName|endswith: '$'
    ProcessName|contains: '\System32\lsass.exe'
  condition: (selection_registry_access or selection_process_args) or
             (selection_lsa_cache_access and not filter_system)
falsepositives:
  - Ferramentas de backup de credenciais autorizadas pelo time de identidade
  - Sistemas de PAM que acessam o cache LSA legitimamente
fields:
  - SubjectUserName
  - ProcessName
  - CommandLine
  - ObjectName
level: high

