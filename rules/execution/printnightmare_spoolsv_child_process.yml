title: PrintNightmare — Shell Spawned by spoolsv.exe (CVE-2021-1675 / CVE-2021-34527)
id: c3d4e5f6-a7b8-9012-cdef-123456789012
status: test
description: |
  Detecta exploração do PrintNightmare via processo filho suspeito gerado pelo spooler de impressão
  (spoolsv.exe). A exploração carrega uma DLL maliciosa via RpcAddPrinterDriverEx, resultando
  em execução de código sob SYSTEM. O indicador mais confiável é spoolsv.exe gerando cmd.exe,
  powershell.exe ou outros shells — comportamento que nunca ocorre legitimamente.
references:
  - https://attack.mitre.org/techniques/T1068/
  - https://attack.mitre.org/techniques/T1569/002/
  - https://msrc.microsoft.com/update-guide/vulnerability/CVE-2021-34527
author: HKK
date: 2025/07/01
modified: 2025/07/01
tags:
  - attack.execution
  - attack.privilege_escalation
  - attack.t1068
  - attack.t1569.002
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 1          # Process Creation
    ParentImage|endswith: '\spoolsv.exe'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\regsvr32.exe'
      - '\rundll32.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
  filter_legit_spooler:
    # spoolsv.exe pode chamar splwow64.exe e outros processos de impressão legítimos
    Image|endswith:
      - '\splwow64.exe'
      - '\PrintIsolationHost.exe'
  condition: selection and not filter_legit_spooler
falsepositives:
  - Plugins de impressão de terceiros que invocam processos auxiliares via spoolsv
  - Ambientes com soluções de impressão avançadas (ex: Follow-Me Printing, PaperCut em modo legado)
fields:
  - Image
  - ParentImage
  - CommandLine
  - User
  - ParentCommandLine
level: critical
